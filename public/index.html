<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 聚合网关 · Workers</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --border:#e3e6ea; --text:#1b1f24; --muted:#6b7480;
  --accent:#2f6feb; --accent-fg:#fff; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117; --panel:#161b22; --border:#2a313a; --text:#e6edf3; --muted:#8b949e;
  --accent:#3b82f6; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:8px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--err);border-color:var(--border)}
button.danger:hover{border-color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);width:100%}
textarea{min-height:70px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:12.5px}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav button{border:none;background:none;padding:6px 11px;border-radius:8px;color:var(--muted)}
nav button.active{background:var(--bg);color:var(--text);font-weight:600}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:14px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .v{font-size:22px;font-weight:600;margin-top:2px}
.stat .k{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
tbody tr:hover{background:var(--bg)}
.scroll{overflow-x:auto}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;border:1px solid var(--border)}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.err{color:var(--err);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.muted{color:var(--muted)}
.center{min-height:80vh;display:grid;place-items:center}
.auth{width:340px}
#toast{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);max-width:360px}
.toast.err{border-left-color:var(--err)}
.toast.ok{border-left-color:var(--ok)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);color:var(--text);padding:0;max-width:620px;width:92vw;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-body{padding:18px;max-height:74vh;overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.term{background:#0d1117;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.term-out{height:420px;overflow:auto;padding:12px;white-space:pre-wrap;word-break:break-word;color:#e6edf3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5}
.term-out .term-err{color:#f85149}
.term-out .term-hint{color:#8b949e}
.term-in{display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid #2a313a}
.term-in .ps{color:#3fb950;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.term-in input{flex:1;background:#161b22;border:1px solid #2a313a;color:#e6edf3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;padding:5px 8px}
.term-in input:focus{outline:none;border-color:var(--accent)}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>

<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const app = document.getElementById('app');

// 单一管理员令牌，存放在 localStorage；除 /api/status 外所有请求都带 Bearer 头。
const KEY_STORAGE = 'oneapi_admin_key';
let state = { owner: null, status: null, page: 'dashboard' };
const QUOTA_PER_USD = 500000;
const usd = (q) => '$' + (Number(q || 0) / QUOTA_PER_USD).toFixed(4);
const num = (s) => { const n = Number(s); return Number.isFinite(n) ? n : 0; };
const ts = (t) => (!t || t < 0) ? '—' : new Date(t * 1000).toLocaleString('zh-CN', { hour12: false });

function toast(msg, kind = '') {
  const el = $(`<div class="toast ${kind}">${esc(msg)}</div>`);
  document.getElementById('toast').append(el);
  setTimeout(() => el.remove(), 4000);
}

async function api(path, opts = {}) {
  const key = localStorage.getItem(KEY_STORAGE);
  const res = await fetch('/api' + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(key ? { Authorization: 'Bearer ' + key } : {}),
      ...(opts.headers || {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    // 令牌失效：清掉存储、回解锁页，再把错误抛给调用方去 toast。
    localStorage.removeItem(KEY_STORAGE);
    state.owner = null;
    showUnlock();
    throw new Error('管理令牌无效或已失效，请重新解锁');
  }
  let json;
  try { json = await res.json(); } catch { json = { success: false, message: 'HTTP ' + res.status }; }
  if (!json.success) throw new Error(json.message || 'HTTP ' + res.status);
  return json.data;
}

// ---------------------------------------------------------------- shell

async function boot() {
  state.status = await api('/status').catch(() => null);
  if (!state.status) { app.innerHTML = '<div class="center"><p>无法连接到服务</p></div>'; return; }
  if (!localStorage.getItem(KEY_STORAGE)) return showUnlock();
  try { state.owner = await api('/owner'); } catch (err) { toast(err.message, 'err'); return; }
  const h = parseHash();
  if (h) {
    if (h.page === 'pricing' && h.q) pendingPricingQuery = h.q;
    state.page = h.page;
  }
  render();
}

/** 解锁页：唯一入口是管理令牌，用 GET /api/owner 验证。已在解锁页时不重复渲染，保留已输入内容。 */
function showUnlock() {
  stopAutoRefresh();
  if (document.getElementById('adminKey')) return;
  app.replaceChildren($(`<div class="center"><div class="card auth">
    <h2>${esc(state.status?.system_name || 'One API')}</h2>
    <p class="muted">个人专用网关，输入管理令牌解锁。</p>
    <label>管理令牌（ADMIN_KEY）</label><input id="adminKey" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button class="primary" id="unlock" style="width:100%">解锁</button></div>
  </div></div>`));
  const input = document.getElementById('adminKey');
  const submit = async () => {
    const key = input.value.trim();
    if (!key) return toast('请输入管理令牌', 'err');
    localStorage.setItem(KEY_STORAGE, key);
    try {
      state.owner = await api('/owner');
      toast('已解锁', 'ok'); render();
    } catch (err) {
      localStorage.removeItem(KEY_STORAGE);
      toast(err.message, 'err');
    }
  };
  document.getElementById('unlock').onclick = submit;
  input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  input.focus();
}

const PAGES = {
  dashboard: ['总览', pageDashboard],
  tokens: ['令牌', pageTokens],
  channels: ['渠道', pageChannels],
  pricing: ['价格', pagePricing],
  billing: ['模型计费', pageModelBilling],
  health: ['健康', pageHealth],
  logs: ['日志', pageLogs],
  terminal: ['终端', pageTerminal],
  settings: ['设置', pageSettings],
};

function render() {
  stopAutoRefresh();
  const tabs = Object.entries(PAGES)
    .map(([key, cfg]) => `<button data-page="${key}" class="${state.page === key ? 'active' : ''}">${esc(cfg[0])}</button>`)
    .join('');

  app.replaceChildren(
    $(`<header>
        <h1>${esc(state.status.system_name)}</h1>
        <nav>${tabs}</nav>
        <span class="muted">已解锁</span>
        <button id="lock">锁定</button>
      </header>`),
    $('<div class="wrap" id="view"><p class="muted">加载中…</p></div>'),
  );

  app.querySelectorAll('nav button').forEach((b) => (b.onclick = () => { state.page = b.dataset.page; render(); }));
  document.getElementById('lock').onclick = () => {
    localStorage.removeItem(KEY_STORAGE);
    state.owner = null;
    toast('已锁定', 'ok');
    showUnlock();
  };

  const fn = (PAGES[state.page] || PAGES.dashboard)[1];
  fn(document.getElementById('view')).catch((e) => toast(e.message, 'err'));
}

// 极简 hash 路由：#页签 直接跳页；#pricing?q=模型名 会在价格页自动填过滤框。
let pendingPricingQuery = '';
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return null;
  const [page, query] = h.split('?');
  if (!PAGES[page]) return null;
  return { page, q: new URLSearchParams(query || '').get('q') || '' };
}
window.addEventListener('hashchange', () => {
  const h = parseHash();
  if (!h || !state.owner) return; // 未解锁时忽略，交由解锁流程接管
  if (h.page === 'pricing' && h.q) pendingPricingQuery = h.q;
  state.page = h.page;
  render();
});

function table(cols, rows, renderRow) {
  return `<div class="scroll"><table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(renderRow).join('') : `<tr><td colspan="${cols.length}" class="muted">暂无数据</td></tr>`}</tbody></table></div>`;
}

function dialog(title, innerHTML, onSave, okLabel = '保存') {
  const dlg = $(`<dialog><div class="dlg-body"><h2 style="margin-top:0">${esc(title)}</h2>${innerHTML}</div>
    <div class="dlg-foot"><button data-x>取消</button><button class="primary" data-ok>${esc(okLabel)}</button></div></dialog>`);
  document.body.append(dlg);
  dlg.showModal();
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('[data-x]').onclick = close;
  dlg.querySelector('[data-ok]').onclick = async (e) => {
    e.target.disabled = true;
    try { await onSave(dlg); close(); } catch (err) { toast(err.message, 'err'); e.target.disabled = false; }
  };
  return dlg;
}
const val = (dlg, id) => dlg.querySelector('#' + id)?.value ?? '';

/**
 * 给当前页面挂一个自动刷新：每 REFRESH_MS 拉一次数据，标签页切到后台就停表，
 * 切回来立刻补一次 —— 后台期间一个请求都不发。
 * 同一时刻只允许一个页面注册，render() 换页时会先调 stopAutoRefresh() 收摊。
 */
const REFRESH_MS = 30000;
let stopRefresh = null;

function stopAutoRefresh() { if (stopRefresh) { stopRefresh(); stopRefresh = null; } }

function autoRefresh(fn) {
  let timer = null, busy = false;
  const tick = async () => {
    if (busy || document.hidden) return;
    busy = true;
    try { await fn(); } catch { /* 自动刷新失败保持安静，别 30 秒弹一次 toast */ }
    finally { busy = false; }
  };
  const start = () => { if (!timer) timer = setInterval(tick, REFRESH_MS); };
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
  const onVis = () => { if (document.hidden) stop(); else { start(); tick(); } };
  document.addEventListener('visibilitychange', onVis);
  if (!document.hidden) start();
  stopRefresh = () => { stop(); document.removeEventListener('visibilitychange', onVis); };
}

// ---------------------------------------------------------------- 总览

async function pageDashboard(view) {
  await loadDashboard(view);
  autoRefresh(() => loadDashboard(view));
}

async function loadDashboard(view) {
  // 计费横幅：拉取失败静默，不打扰总览。
  const [d, billing] = await Promise.all([api('/dashboard'), api('/model-billing').catch(() => null)]);
  const bun = billing?.totals?.unconfigured || 0;
  const byModel = {};
  for (const r of d.daily) {
    byModel[r.model_name] = byModel[r.model_name] || { count: 0, quota: 0, pt: 0, ct: 0 };
    byModel[r.model_name].count += r.count;
    byModel[r.model_name].quota += r.quota;
    byModel[r.model_name].pt += r.prompt_tokens;
    byModel[r.model_name].ct += r.completion_tokens;
  }
  const models = Object.entries(byModel).sort((a, b) => b[1].quota - a[1].quota);
  const max = Math.max(1, ...models.map(([, m]) => m.quota));

  view.replaceChildren($(`<div>
    ${bun > 0 ? `<div class="card" style="border-color:var(--err);margin-bottom:12px;padding:10px 16px">
      <span style="color:var(--err)">有 ${bun} 个模型没有配置价格${billing.strict_billing ? '，将拒绝请求' : ''}</span>
      · <a href="#billing">去模型计费页</a></div>` : ''}
    <div class="stats" style="margin-bottom:12px">
      <div class="stat"><div class="k">余额</div><div class="v">${usd(d.self.quota)}</div></div>
      <div class="stat"><div class="k">累计消耗</div><div class="v">${usd(d.self.used_quota)}</div></div>
      <div class="stat"><div class="k">近 7 天请求</div><div class="v">${d.totals.requests}</div></div>
      <div class="stat"><div class="k">近 7 天消耗</div><div class="v">${usd(d.totals.quota)}</div></div>
    </div>
    <div class="row" style="margin-bottom:16px"><button id="adjust">调整余额</button>
      <span class="muted">余额来自 owner 账户，支持正负美元直接加减</span></div>
    <div class="card"><h2>近 7 天模型用量</h2>
      ${table(['模型', '请求数', '输入 tokens', '输出 tokens', '消耗', ''], models, ([name, m]) => `<tr>
        <td class="mono">${esc(name)}</td><td>${m.count}</td><td>${m.pt}</td><td>${m.ct}</td><td>${usd(m.quota)}</td>
        <td style="width:180px"><div class="bar"><i style="width:${(m.quota / max * 100).toFixed(1)}%"></i></div></td></tr>`)}
    </div>
    <div class="card"><h2>接入方式</h2>
      <p class="muted">把你的客户端 Base URL 指向下面地址，API Key 使用「令牌」页创建的 sk- 开头密钥。</p>
      <p class="mono">${esc(location.origin)}/v1</p>
    </div>
  </div>`));

  document.getElementById('adjust').onclick = () => dialog('调整余额', `
    <label>调整额（美元，正负均可，如 -5 或 10）</label><input id="delta" type="number" step="0.0001">`,
    async (dlg) => {
      const n = Number(val(dlg, 'delta'));
      if (!Number.isFinite(n) || n === 0) throw new Error('请输入非零金额');
      const r = await api('/owner/adjust', { method: 'POST', body: { usd: n } });
      toast(`已调整，当前余额 $${Number(r.usd ?? 0).toFixed(4)}`, 'ok');
      loadDashboard(view);
    });
}

// ---------------------------------------------------------------- 令牌

async function pageTokens(view) {
  const rows = await api('/tokens');
  const STATUS = { 1: ['启用', 'ok'], 2: ['已禁用', 'err'], 3: ['已过期', 'warn'], 4: ['额度耗尽', 'warn'] };

  view.replaceChildren($(`<div class="card">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0;flex:1">令牌</h2><button class="primary" id="new">新建令牌</button></div>
    ${table(['ID', '名称', '密钥', '状态', '剩余额度', '已用', '过期时间', '模型限制', '定制价', '操作'], rows, (t) => {
      const pc = (t.price_config && typeof t.price_config === 'object') ? Object.keys(t.price_config).length : 0;
      return `<tr>
      <td>${t.id}</td><td>${esc(t.name)}</td>
      <td><code>sk-${esc(t.key.slice(0, 6))}…</code> <button data-copy="${esc(t.key)}">复制</button></td>
      <td><span class="tag ${STATUS[t.status]?.[1] || ''}">${STATUS[t.status]?.[0] || t.status}</span></td>
      <td>${t.unlimited_quota ? '<span class="tag">无限</span>' : usd(t.remain_quota)}</td>
      <td>${usd(t.used_quota)}</td><td>${t.expired_time < 0 ? '永不' : ts(t.expired_time)}</td>
      <td class="mono">${esc(t.models || '全部')}</td>
      <td>${pc ? pc + ' 项' : '—'}</td>
      <td><button data-edit="${t.id}">编辑</button> <button class="danger" data-del="${t.id}">删除</button></td></tr>`;
    })}
  </div>`));

  view.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => {
    navigator.clipboard.writeText('sk-' + b.dataset.copy); toast('完整密钥已复制', 'ok');
  }));

  const form = (t = {}) => `
    <label>名称</label><input id="name" value="${esc(t.name || '')}">
    <label>额度（美元，留空或勾选无限则不限）</label><input id="quota" type="number" step="0.01" value="${t.remain_quota ? (t.remain_quota / QUOTA_PER_USD).toFixed(4) : ''}">
    <label><input type="checkbox" id="unl" style="width:auto" ${t.unlimited_quota ? 'checked' : ''}> 无限额度</label>
    <label>过期时间（留空为永不过期）</label><input id="exp" type="datetime-local" value="${t.expired_time > 0 ? new Date(t.expired_time * 1000).toISOString().slice(0, 16) : ''}">
    <label>可用模型（逗号分隔，留空表示全部）</label><input id="models" value="${esc(t.models || '')}">
    <label>价格配置（可选 JSON）</label>
    <textarea id="price_config" placeholder='{"my-model":{"in":1.32,"out":3.96,"cached_in":0.044},"long-ctx":{"in":"4*(context>272k?2:1)"}}'>${t.price_config ? esc(JSON.stringify(t.price_config, null, 2)) : ''}</textarea>
    <p class="muted" style="margin:4px 0 0">同一模型在此 Key 上的价格覆盖全局价格覆盖与内置价格表。留空 = 不修改（新建时留空 = 不配置）；提交 <code>{}</code> 表示清空。</p>
    ${t.id ? `<label>状态</label><select id="status"><option value="1"${t.status === 1 ? ' selected' : ''}>启用</option><option value="2"${t.status === 2 ? ' selected' : ''}>禁用</option></select>` : ''}`;

  const collect = (dlg) => {
    const body = {
      name: val(dlg, 'name') || '默认令牌',
      remain_quota: Math.round((parseFloat(val(dlg, 'quota')) || 0) * QUOTA_PER_USD),
      unlimited_quota: dlg.querySelector('#unl').checked,
      expired_time: val(dlg, 'exp') ? Math.floor(new Date(val(dlg, 'exp')).getTime() / 1000) : -1,
      models: val(dlg, 'models').trim(),
      ...(dlg.querySelector('#status') ? { status: Number(val(dlg, 'status')) } : {}),
    };
    const raw = val(dlg, 'price_config').trim();
    if (raw) {
      let pc;
      try { pc = JSON.parse(raw); } catch { throw new Error('价格配置不是合法 JSON'); }
      if (!pc || typeof pc !== 'object' || Array.isArray(pc)) throw new Error('价格配置必须是 JSON 对象');
      body.price_config = pc; // 编辑：缺省字段 = 不修改，{} = 清空；新建：留空即无
    }
    return body;
  };

  document.getElementById('new').onclick = () => dialog('新建令牌', form(), async (dlg) => {
    const t = await api('/tokens', { method: 'POST', body: collect(dlg) });
    await navigator.clipboard.writeText('sk-' + t.key).catch(() => {});
    toast('令牌已创建，密钥已复制到剪贴板', 'ok');
    pageTokens(view);
  });

  view.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => {
    const t = rows.find((r) => r.id === Number(b.dataset.edit));
    dialog('编辑令牌', form(t), async (dlg) => {
      await api('/tokens/' + t.id, { method: 'PUT', body: collect(dlg) });
      toast('已保存', 'ok'); pageTokens(view);
    });
  }));

  view.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (!confirm('确定删除该令牌？')) return;
    await api('/tokens/' + b.dataset.del, { method: 'DELETE' });
    toast('已删除', 'ok'); pageTokens(view);
  }));
}

async function pageChannels(view) {
  const [rows, meta] = await Promise.all([api('/channels'), api('/channels/meta')]);
  const STATUS = { 1: ['启用', 'ok'], 2: ['手动禁用', 'err'], 3: ['自动禁用', 'warn'] };

  view.replaceChildren($(`<div class="card">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0;flex:1">渠道</h2><button class="primary" id="new">新建渠道</button></div>
    ${table(['ID', '名称', '类型', '状态', '优先级/权重', '模型', '已用', '响应', '操作'], rows, (ch) => `<tr>
      <td>${ch.id}</td><td>${esc(ch.name)}</td><td>${esc(ch.type)}</td>
      <td><span class="tag ${STATUS[ch.status]?.[1] || ''}">${STATUS[ch.status]?.[0] || ch.status}</span></td>
      <td>${ch.priority} / ${ch.weight}</td>
      <td class="mono" style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(ch.models)}</td>
      <td>${usd(ch.used_quota)}</td><td>${ch.response_time ? ch.response_time + 'ms' : '—'}</td>
      <td style="white-space:nowrap"><button data-test="${ch.id}">测试</button> <button data-edit="${ch.id}">编辑</button> <button class="danger" data-del="${ch.id}">删除</button></td></tr>`)}
  </div>`));

  const form = (ch = {}) => `
    <div class="grid">
      <div><label>名称</label><input id="name" value="${esc(ch.name || '')}"></div>
      <div><label>类型</label><select id="type">${meta.adaptors.map((a) => `<option value="${a.name}"${ch.type === a.name ? ' selected' : ''}>${esc(a.label)}</option>`).join('')}</select></div>
    </div>
    <label>API Key${ch.id ? '（留空表示不修改）' : ''}</label><input id="key" placeholder="${ch.id ? esc(ch.key) : ''}">
    <label>Base URL（留空使用默认；OpenAI 兼容厂商可选下面预设）</label>
    <div class="row"><input id="base_url" value="${esc(ch.base_url || '')}" style="flex:1">
      <select id="preset" style="width:150px"><option value="">预设…</option>${Object.entries(meta.presets).map(([k, v]) => `<option value="${esc(v)}">${esc(k)}</option>`).join('')}</select></div>
    <label>模型列表（逗号分隔）</label><textarea id="models">${esc(ch.models || '')}</textarea>
    <div class="row"><button type="button" id="fill" style="margin-top:6px">填入内置价格表中的常见模型</button>
      <button type="button" id="fetchModels" style="margin-top:6px">从上游拉取</button></div>
    <div class="grid">
      <div><label>优先级（大者优先）</label><input id="priority" type="number" value="${ch.priority ?? 0}"></div>
      <div><label>权重（同优先级内随机）</label><input id="weight" type="number" min="1" value="${ch.weight ?? 1}"></div>
      <div><label>状态</label><select id="status"><option value="1"${ch.status === 1 ? ' selected' : ''}>启用</option><option value="2"${ch.status === 2 ? ' selected' : ''}>禁用</option></select></div>
    </div>
    <label>模型重定向 JSON（可选，如 {"gpt-4":"gpt-4o"}）</label><textarea id="model_mapping">${esc(ch.model_mapping || '')}</textarea>
    <label>渠道额外配置 JSON（可选，如 {"api_version":"2024-10-21"}）</label><textarea id="config">${esc(ch.config || '')}</textarea>
    <label>系统提示词（可选，注入到每个请求）</label><textarea id="system_prompt">${esc(ch.system_prompt || '')}</textarea>`;

  // 从上游拉取模型列表：POST /api/channels/fetch-models。新建渠道用表单现输入的
  // {type, base_url, key, config?}；编辑已有渠道且 key 留空时改用 {channel_id}（后端取已存 Key）。
  const fetchUpstreamModels = (formDlg, ch) => {
    const keyVal = val(formDlg, 'key').trim();
    const cfg = val(formDlg, 'config').trim();
    const body = keyVal
      ? { type: val(formDlg, 'type'), base_url: val(formDlg, 'base_url').trim(), key: keyVal, ...(cfg ? { config: cfg } : {}) }
      : (ch.id ? { channel_id: ch.id } : { type: val(formDlg, 'type'), base_url: val(formDlg, 'base_url').trim(), key: '' });
    const dlg = dialog('从上游拉取模型',
      '<div id="fmArea" class="row"><span class="spin"></span><span class="muted">正在请求上游 /v1/models …</span></div>',
      async (d) => {
        const picked = [...d.querySelectorAll('input[data-m]:checked')].map((c) => c.dataset.m);
        if (!picked.length) throw new Error('请勾选至少一个模型');
        const ta = formDlg.querySelector('#models');
        const have = new Set(ta.value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean));
        ta.value = [...have, ...picked.filter((m) => !have.has(m))].join(', ');
        toast(`已合并 ${picked.length} 个模型`, 'ok');
      }, '合并选中项');
    dlg.querySelector('[data-ok]').disabled = true;
    (async () => {
      let list;
      try {
        const r = await api('/channels/fetch-models', { method: 'POST', body });
        list = Array.isArray(r?.models) ? r.models : [];
      } catch (e) {
        dlg.close(); dlg.remove();
        toast(e.message, 'err');
        return;
      }
      if (!list.length) { dlg.close(); dlg.remove(); toast('上游未返回任何模型'); return; }
      const area = dlg.querySelector('#fmArea');
      area.className = '';
      area.innerHTML = `
        <div class="row" style="margin-bottom:8px">
          <input id="fmQ" placeholder="按模型名过滤…" style="flex:1">
          <button type="button" id="fmAll">全选</button>
          <button type="button" id="fmNone">清空</button>
        </div>
        <div style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px">
          ${list.map((m) => `<label style="margin:2px 0;display:flex;align-items:center;gap:6px"><input type="checkbox" data-m="${esc(m)}" style="width:auto" checked><span class="mono">${esc(m)}</span></label>`).join('')}
        </div>
        <p class="muted" style="margin:8px 0 0">共 ${list.length} 个模型；确认后勾选项会<b>追加合并</b>进「模型列表」（自动去重，保留手工已输入项）。</p>`;
      const q = dlg.querySelector('#fmQ');
      const visBoxes = () => [...area.querySelectorAll('label')]
        .filter((l) => !l.hidden).map((l) => l.querySelector('input[data-m]'));
      q.oninput = () => {
        const s = q.value.trim().toLowerCase();
        [...area.querySelectorAll('label')].forEach((l) => { l.hidden = !!s && !l.textContent.toLowerCase().includes(s); });
      };
      dlg.querySelector('#fmAll').onclick = () => visBoxes().forEach((c) => { c.checked = true; });
      dlg.querySelector('#fmNone').onclick = () => [...area.querySelectorAll('input[data-m]')].forEach((c) => { c.checked = false; });
      dlg.querySelector('[data-ok]').disabled = false;
    })();
  };

  const wire = (dlg, ch = {}) => {
    dlg.querySelector('#preset').onchange = (e) => { if (e.target.value) dlg.querySelector('#base_url').value = e.target.value; };
    dlg.querySelector('#fill').onclick = () => { dlg.querySelector('#models').value = meta.known_models.join(','); };
    dlg.querySelector('#fetchModels').onclick = () => fetchUpstreamModels(dlg, ch);
  };

  const collect = (dlg) => {
    for (const f of ['model_mapping', 'config']) {
      const v = val(dlg, f).trim();
      if (v) { try { JSON.parse(v); } catch { throw new Error(`${f} 不是合法 JSON`); } }
    }
    return {
      name: val(dlg, 'name'), type: val(dlg, 'type'), key: val(dlg, 'key'),
      base_url: val(dlg, 'base_url').trim(), models: val(dlg, 'models').trim(),
      priority: Number(val(dlg, 'priority')) || 0, weight: Number(val(dlg, 'weight')) || 1,
      status: Number(val(dlg, 'status')),
      model_mapping: val(dlg, 'model_mapping').trim(), config: val(dlg, 'config').trim(),
      system_prompt: val(dlg, 'system_prompt'),
    };
  };

  document.getElementById('new').onclick = () => {
    const dlg = dialog('新建渠道', form(), async (d) => {
      await api('/channels', { method: 'POST', body: collect(d) });
      toast('渠道已创建', 'ok'); pageChannels(view);
    });
    wire(dlg);
  };

  view.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => {
    const ch = rows.find((r) => r.id === Number(b.dataset.edit));
    const dlg = dialog('编辑渠道 #' + ch.id, form(ch), async (d) => {
      await api('/channels/' + ch.id, { method: 'PUT', body: collect(d) });
      toast('已保存', 'ok'); pageChannels(view);
    });
    wire(dlg, ch);
  }));

  // 行内「测试」→ 弹窗选模型；双击选项 = 直接确认。
  view.querySelectorAll('[data-test]').forEach((b) => (b.onclick = () => {
    const ch = rows.find((r) => r.id === Number(b.dataset.test));
    if (!ch) return;
    const models = [...new Set((ch.models || '').split(/[,\n]/).map((s) => s.trim()).filter(Boolean))];
    if (!models.length) return toast('渠道未配置模型', 'err');
    dialog(`测试渠道 #${ch.id} ${ch.name}`, `
      <label style="margin-top:0">模型（共 ${models.length} 个）</label>
      ${models.length > 8 ? '<input id="testFilter" placeholder="按模型名过滤…" style="margin-bottom:8px">' : ''}
      <select id="testModel" size="${Math.min(10, Math.max(2, models.length))}" style="width:100%">
        ${models.map((m, idx) => `<option value="${esc(m)}"${idx === 0 ? ' selected' : ''}>${esc(m)}</option>`).join('')}
      </select>`,
      async (dlg) => {
        const model = dlg.querySelector('#testModel').value;
        if (!model) throw new Error('请先选择一个模型');
        b.disabled = true; b.textContent = '测试中…';
        try {
          await api('/channels/' + ch.id + '/test', { method: 'POST', body: { model } });
          toast(`测试通过（${model}）`, 'ok');
        } finally {
          b.disabled = false; b.textContent = '测试';
        }
        pageChannels(view);
      }, '测试');
    const sel = document.getElementById('testModel');
    const flt = document.getElementById('testFilter');
    if (flt) flt.oninput = () => {
      const s = flt.value.trim().toLowerCase();
      [...sel.options].forEach((o) => { o.hidden = !!s && !o.value.toLowerCase().includes(s); });
    };
    sel.ondblclick = (e) => {
      if (e.target.tagName === 'OPTION') sel.closest('dialog').querySelector('[data-ok]').click();
    };
  }));

  view.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (!confirm('确定删除该渠道？')) return;
    await api('/channels/' + b.dataset.del, { method: 'DELETE' });
    toast('已删除', 'ok'); pageChannels(view);
  }));
}

async function loadPricing(view) {
  const p = await api('/pricing');
  const builtIn = p.built_in || {};
  const loadedOverrides = p.global_overrides || {};
  const dp = p.default_price || {};
  const aliases = p.alias_prefixes || [];

  // v2：价格对象的每个字段都可以是数字常量或费率表达式字符串，空 = 不设置该字段。
  const FIELDS = [
    ['in', '输入', '输入 $/1M'],
    ['out', '输出', '输出 $/1M'],
    ['cached_in', '缓存读', '缓存命中（读）$/1M'],
    ['cache_write_5m', '缓存写5m', '缓存写入 5m $/1M'],
    ['cache_write_1h', '缓存写1h', '缓存写入 1h $/1M'],
  ];

  function mkRow(name, spec, isNew) {
    const s = spec || {};
    const r = { name, isNew, err: '' };
    for (const [f] of FIELDS) r[f] = s[f] ?? '';
    return r;
  }

  // 本地可编辑状态：合并 built_in ∪ global_overrides；所有编辑先落在 rows，点「保存全部」才提交。
  const rows = [...new Set([...Object.keys(builtIn), ...Object.keys(loadedOverrides)])]
    .sort((a, b) => a.localeCompare(b))
    .map((name) => mkRow(name, loadedOverrides[name] ?? builtIn[name], false));
  const filter = { q: '', coveredOnly: false };

  // 纯数字串转数字，其余按费率表达式原样保留；空 = 不设置。
  function fieldValue(v) {
    const t = String(v ?? '').trim();
    if (t === '') return undefined;
    return /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t) ? Number(t) : t;
  }

  // 行当前表示的 PriceSpec。
  function specOf(r) {
    const spec = {};
    for (const [f] of FIELDS) {
      const v = fieldValue(r[f]);
      if (v !== undefined) spec[f] = v;
    }
    return spec;
  }

  function sameSpec(a, b) {
    if (!a || !b) return false;
    return FIELDS.every(([f]) => fieldValue(a[f]) === fieldValue(b[f]));
  }

  // 会作为覆盖提交的行：不在内置表，或当前值 ≠ 内置值（「恢复默认」即清除覆盖）。
  const isOverriding = (r) => !builtIn[r.name] || !sameSpec(specOf(r), builtIn[r.name]);
  const rowDirty = (r) => r.isNew || !sameSpec(specOf(r), loadedOverrides[r.name] ?? builtIn[r.name]);

  view.replaceChildren($(`<div>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 style="margin:0;flex:1">模型价格</h2>
        <button class="primary" id="addModel">＋ 新增模型</button>
        <input id="q" placeholder="按模型名过滤…" style="width:200px">
        <label style="margin:0"><input type="checkbox" id="coveredOnly" style="width:auto"> 仅看已覆盖</label>
      </div>
      <p class="muted" style="margin:0 0 10px">生效价优先级：令牌 price_config &gt; 全局覆盖（标「已覆盖」）&gt; 内置表（标「内置」）。
      前缀别名：${aliases.length ? aliases.map((a) => `<code>${esc(a)}</code>`).join('、') + ' —— 请求的模型名命中前缀时先剥掉前缀再查表' : '无'}。
      内部额度：1 美元 = ${p.quota_per_usd ?? QUOTA_PER_USD} quota。保存为<b>整包替换</b>：与内置值相同的行、被删除的行都会从覆盖里清除。</p>
      <div id="tbl"></div>
    </div>

    <div class="card"><h2>默认兜底价（未知模型）</h2>
      <div class="row">
        <div><label style="margin:0 0 4px">输入 $/1M</label><input id="dpIn" type="number" step="any" min="0" value="${esc(dp.in ?? '')}" style="width:140px"></div>
        <div><label style="margin:0 0 4px">输出 $/1M</label><input id="dpOut" type="number" step="any" min="0" value="${esc(dp.out ?? '')}" style="width:140px"></div>
        <div style="align-self:flex-end"><button type="button" id="dpClear">清除兜底价（启用严格计费）</button></div>
      </div>
      <p class="muted" style="margin:8px 0 0">未知模型的兜底价（只支持常量）。<b>留空/清除 = 严格计费</b>：查不到价的模型直接拒绝（503 model_price_not_configured）；设置了 = 按此价记账。</p>
    </div>

    <div class="card"><h2>费率表达式（v2）</h2>
      <p class="muted">价格对象的每个字段（in / out / cached_in / cache_write_5m / cache_write_1h）都可以是<b>数字常量</b>或<b>费率表达式</b>字符串；单位都是美元/百万 tokens，每次请求逐字段求值。</p>
      <h2 style="margin-top:14px;font-size:13px">变量</h2>
      ${table(['变量', '含义'], [
        ['context', '本次请求的上下文长度（tokens）'],
        ['len', '输入长度'],
        ['n', '请求的 n 参数（候选数）'],
      ], ([k, v]) => `<tr><td class="mono">${k}</td><td>${v}</td></tr>`)}
      <h2 style="margin-top:14px;font-size:13px">探针函数</h2>
      ${table(['函数', '说明'], [
        ['param("名")', '读请求 body 里的参数值'],
        ['header("名")', '读请求头的值'],
        ['has("名")', '判断某个参数是否存在'],
      ], ([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${esc(v)}</td></tr>`)}
      <h2 style="margin-top:14px;font-size:13px">时间与数值函数</h2>
      ${table(['函数', '说明'], [
        ['hour("Asia/Shanghai") / minute / weekday / day / month', '当前时间的时 / 分 / 星期 / 日 / 月；时区参数可省，默认 UTC'],
        ['min max abs ceil floor', '常规数学函数'],
        ['tier("档名", 值)', '记录命中的档位，便于审计，不影响金额'],
      ], ([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${esc(v)}</td></tr>`)}
      <h2 style="margin-top:14px;font-size:13px">数值与运算符</h2>
      <p class="mono" style="margin:4px 0 0">k / m 后缀（如 272k、1m）&nbsp;&nbsp;·&nbsp;&nbsp;+ - * / %&nbsp;&nbsp;·&nbsp;&nbsp;比较 &gt; &gt;= &lt; &lt;= == !=&nbsp;&nbsp;·&nbsp;&nbsp;三目 ? :&nbsp;&nbsp;·&nbsp;&nbsp;&amp;&amp; || 短路</p>
      <h2 style="margin-top:14px;font-size:13px">示例</h2>
      <p class="muted" style="margin:6px 0 2px">GPT-6 长上下文：上下文超 272k 时输入单价翻倍</p>
      <p class="mono" style="margin:0 0 8px">"in": ${esc('"4*(context>272k?2:1)"')}</p>
      <p class="muted" style="margin:0 0 2px">DeepSeek 谷时：北京时间 1-5 点输入单价打五折</p>
      <p class="mono" style="margin:0">"in": ${esc('"0.3*(hour(\'Asia/Shanghai\')>=1&&hour(\'Asia/Shanghai\')<5?0.5:1)"')}</p>
    </div>

    <div class="row" style="position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5">
      <button class="primary" id="saveAll">保存全部</button>
      <span id="saveHint" class="muted"></span>
    </div>
  </div>`));

  const tbl = document.getElementById('tbl');
  const saveHint = document.getElementById('saveHint');

  const rowHtml = (r, i) => {
    const overriding = isOverriding(r);
    const tag = r.isNew ? '<span class="tag" style="color:var(--accent)">新增</span>'
      : overriding ? '<span class="tag warn">已覆盖</span>' : '<span class="tag">内置</span>';
    const dot = rowDirty(r) ? `<span class="dot" style="color:var(--accent)" title="未保存的修改">· </span>` : '';
    const nameCell = r.isNew
      ? `<input data-field="name" class="mono" value="${esc(r.name)}" placeholder="新模型名">`
      : `<span class="mono">${esc(r.name)}</span>`;
    const priceCell = `<div class="row" style="flex-wrap:nowrap;gap:6px">
        ${FIELDS.map(([f, ph, tip]) => `<input type="text" class="mono" data-field="${f}" value="${esc(r[f])}" placeholder="${ph}" title="${tip}；数字或费率表达式，留空 = 不设置" style="width:112px">`).join('')}
      </div>${r.err ? `<div style="color:var(--err);font-size:12px;margin-top:4px">${esc(r.err)}</div>` : ''}`;
    const act = builtIn[r.name]
      ? (overriding ? `<button data-act="restore" data-idx="${i}">恢复默认</button>` : '<span class="muted">—</span>')
      : `<button class="danger" data-act="delrow" data-idx="${i}">删除行</button>`;
    return `<tr data-idx="${i}">
      <td>${dot}${nameCell}</td>
      <td>${priceCell}</td>
      <td>${tag}</td>
      <td style="white-space:nowrap">${act}</td></tr>`;
  };

  const renderRows = () => {
    const q = filter.q.trim().toLowerCase();
    const shown = rows.map((r, i) => ({ r, i }))
      .filter(({ r }) => (!filter.coveredOnly || r.isNew || isOverriding(r)) && (!q || r.name.toLowerCase().includes(q)));
    tbl.innerHTML = `<div class="scroll"><table><thead><tr>
        <th>模型</th><th style="min-width:620px">价格（数字或费率表达式，留空 = 不设置）</th><th style="width:86px">状态</th><th style="width:110px">操作</th></tr></thead>
      <tbody>${shown.length ? shown.map(({ r, i }) => rowHtml(r, i)).join('') : '<tr><td colspan="4" class="muted">无匹配行</td></tr>'}</tbody></table></div>`;
    saveHint.textContent = `共 ${rows.length} 个模型，${rows.filter(rowDirty).length} 行未保存`;
  };

  // 只更新行首 dirty 点，不整表重渲染，避免输入框失焦。
  const refreshDot = (tr, r) => {
    const td = tr.firstElementChild;
    let dot = td.querySelector('span.dot');
    if (rowDirty(r) && !dot) {
      dot = document.createElement('span');
      dot.className = 'dot'; dot.style.color = 'var(--accent)'; dot.title = '未保存的修改'; dot.textContent = '· ';
      td.prepend(dot);
    } else if (!rowDirty(r) && dot) dot.remove();
  };

  tbl.addEventListener('input', (e) => {
    const field = e.target.dataset.field;
    if (!field) return;
    const tr = e.target.closest('tr');
    const r = rows[Number(tr?.dataset.idx)];
    if (!r) return;
    r[field] = e.target.value;
    r.err = '';
    refreshDot(tr, r);
    saveHint.textContent = `共 ${rows.length} 个模型，${rows.filter(rowDirty).length} 行未保存`;
  });

  tbl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const i = Number(b.dataset.idx);
    if (b.dataset.act === 'delrow') rows.splice(i, 1);
    else if (b.dataset.act === 'restore') Object.assign(rows[i], mkRow(rows[i].name, builtIn[rows[i].name], false));
    renderRows();
  });

  document.getElementById('addModel').onclick = () => {
    rows.push(mkRow('', null, true));
    renderRows();
    tbl.querySelector(`tr[data-idx="${rows.length - 1}"] input[data-field="name"]`)?.focus();
  };
  document.getElementById('q').oninput = (e) => { filter.q = e.target.value; renderRows(); };
  document.getElementById('coveredOnly').onchange = (e) => { filter.coveredOnly = e.target.checked; renderRows(); };

  document.getElementById('dpClear').onclick = () => {
    document.getElementById('dpIn').value = '';
    document.getElementById('dpOut').value = '';
    toast('已清除兜底价，点「保存全部」后生效（严格计费）', 'ok');
  };

  document.getElementById('saveAll').onclick = async () => {
    const overrides = {};
    const errs = [];
    const seen = new Set();
    for (const r of rows) {
      const name = (r.name || '').trim();
      if (!name) { r.err = '模型名不能为空'; errs.push(r); continue; }
      if (seen.has(name)) { r.err = '模型名重复'; errs.push(r); continue; }
      seen.add(name);
      const spec = specOf(r);
      r.err = '';
      // 整包替换语义：与内置值相同的行不进 overrides（含「恢复默认」=清除覆盖）。
      // 字段级校验交给后端：纯数字串自动转数字，表达式会编译+冒烟，400 message 原样 toast。
      if (!builtIn[name] || !sameSpec(spec, builtIn[name])) overrides[name] = spec;
    }
    const dpIn = document.getElementById('dpIn').value.trim();
    const dpOut = document.getElementById('dpOut').value.trim();
    let default_price = null; // 都留空 = 严格计费
    if (dpIn !== '' || dpOut !== '') {
      const a = Number(dpIn), b = Number(dpOut);
      if (dpIn === '' || dpOut === '' || !Number.isFinite(a) || !Number.isFinite(b) || a < 0 || b < 0) {
        renderRows();
        toast('兜底价需同时填输入/输出两个非负数字，或都留空（严格计费）', 'err');
        return;
      }
      default_price = { in: a, out: b };
    }
    if (errs.length) {
      renderRows();
      toast('有未填完整的行，见表格内红色提示', 'err');
      return;
    }
    try {
      // 400 时后端 message 会原样出现在 toast 里（含字段名与原因）。
      await api('/pricing/overrides', { method: 'PUT', body: { overrides, default_price } });
      toast('价格已保存', 'ok');
      loadPricing(view); // 保存成功后重新拉取，刷新表格与状态 tag
    } catch (e) { toast(e.message, 'err'); }
  };

  if (pendingPricingQuery) {
    filter.q = pendingPricingQuery;
    pendingPricingQuery = '';
  }
  document.getElementById('q').value = filter.q;
  renderRows();
}

const BILLING_SRC = { table: '内置', alias: '别名', mapping: '映射', override: '全局', key: 'Key', default: '兜底' };
let billingFilter = { q: '', unconfOnly: false };

async function pageModelBilling(view) {
  await loadModelBilling(view);
}

async function loadModelBilling(view) {
  const d = await api('/model-billing');
  const totals = d.totals || {};
  const unconf = totals.unconfigured || 0;
  const models = d.models || [];
  const fb = d.fallback_price;
  const fmtCost = (n) => '$' + Number(n || 0).toFixed(4);
  const fmtNum = (n) => (n === null || n === undefined ? '—' : Number(n).toLocaleString('en-US'));
  // 字段值：数字直接显示；费率表达式字符串用 mono 截断显示（title 全文）。
  const pcell = (spec, f) => {
    const v = spec?.[f];
    if (v === undefined || v === null) return '—';
    if (typeof v === 'number') return '$' + v;
    return `<code class="mono" title="${esc(String(v))}" style="display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom">${esc(String(v))}</code>`;
  };
  const statusTag = (m) => !m.configured ? '<span class="tag err">未配置</span>'
    : m.partially_configured ? '<span class="tag warn">部分配置</span>' : '<span class="tag ok">已配置</span>';
  const hasUnconf = models.some((m) => m.configured === false);

  const showDetail = (m) => {
    if (!m) return;
    const dlg = dialog(`模型计费详情：${m.model}`, `
      ${m.price_varies ? '<p style="color:var(--warn);margin:0 0 8px">⚠ 各渠道价格不一致</p>' : ''}
      ${table(['渠道', '类型', '启用', '声明', '上游模型', '有价', '来源', '计费名', '7天用量'], m.channels || [], (c) => `<tr>
        <td>${esc(c.name)}</td><td class="mono">${esc(c.type)}</td>
        <td>${c.enabled ? '<span class="tag ok">启用</span>' : '<span class="tag err">禁用</span>'}</td>
        <td>${c.declared ? '是' : '—'}</td>
        <td class="mono" style="max-width:160px;overflow:hidden;text-overflow:ellipsis">${esc(c.upstream_model || '—')}</td>
        <td>${c.configured ? '是' : '否'}</td>
        <td>${BILLING_SRC[c.source] || esc(c.source || '—')}</td>
        <td>${c.via === 'upstream' ? '上游名' : '请求名'}${c.billing_model ? ` <span class="mono">${esc(c.billing_model)}</span>` : ''}</td>
        <td>${fmtNum(c.usage?.requests)} 次 · ${fmtCost(c.usage?.cost_usd)}</td></tr>`)}
      <h2 style="margin:12px 0 6px;font-size:13px">近 7 天用量</h2>
      <div class="stats">
        <div class="stat"><div class="k">请求</div><div class="v">${fmtNum(m.usage?.requests)}</div></div>
        <div class="stat"><div class="k">输入 tokens</div><div class="v">${fmtNum(m.usage?.prompt_tokens)}</div></div>
        <div class="stat"><div class="k">输出 tokens</div><div class="v">${fmtNum(m.usage?.completion_tokens)}</div></div>
        <div class="stat"><div class="k">缓存命中率</div><div class="v">${m.usage?.cache_hit_rate == null ? '未知' : pct(m.usage.cache_hit_rate)}</div></div>
        <div class="stat"><div class="k">缓存命中 tokens</div><div class="v">${m.usage?.cached_tokens == null ? '未知' : fmtNum(m.usage.cached_tokens)}</div></div>
        <div class="stat"><div class="k">消费</div><div class="v">${fmtCost(m.usage?.cost_usd)}</div></div>
      </div>
      <p class="muted" style="margin:10px 0 0">计费版本 <span class="mono">${esc(m.pricing_version || '—')}</span> · 最近计费 ${m.last_priced_at ? esc(String(m.last_priced_at)) : '—'}${m.logged_billing_model ? ` · 记账模型 <span class="mono">${esc(m.logged_billing_model)}</span>` : ''}</p>
      <div style="margin-top:12px"><button class="primary" id="gotoPrice">修改价格</button></div>`,
      async () => {}, '关闭');

      dlg.close(); dlg.remove();
      location.hash = '#pricing?q=' + encodeURIComponent(m.model);
      toast(`已切到价格页并按「${m.model}」过滤，点对应行直接改价`, 'ok');
    };
  };

  view.replaceChildren($(`<div>
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="k">模型数</div><div class="v">${totals.models ?? 0}</div></div>
      <div class="stat"><div class="k">未配置价格</div><div class="v"${unconf > 0 ? ' style="color:var(--err)"' : ''}>${unconf}</div></div>
      <div class="stat"><div class="k">近 7 天请求</div><div class="v">${fmtNum(totals.requests)}</div></div>
      <div class="stat"><div class="k">近 7 天消费</div><div class="v">${fmtCost(totals.cost_usd)}</div></div>
    </div>

    ${unconf > 0 ? `<div class="card" style="border-color:var(--err)">
      <h2 style="color:var(--err)">有 ${unconf} 个模型没有配置价格</h2>
      <p class="muted" style="margin:0 0 6px">${d.strict_billing
        ? '严格计费已启用，没有默认价：这些模型的请求会被拒绝，用户会收到「未配置价格」(model_price_not_configured) 的错误。'
        : `当前按兜底价 $${esc(fb?.in ?? '?')}/$${esc(fb?.out ?? '?')} 记账：这些模型先按兜底价出账，补价后自动按新价。`}</p>
      <p class="muted" style="margin:0">处理：点「修改价格」在价格页为它配全局覆盖（数字或费率表达式），或在渠道的模型重定向里指向有价格的上游模型。</p>
    </div>` : ''}

    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 style="margin:0;flex:1">模型计费（近 ${d.window_days ?? 7} 天）</h2>

        ${hasUnconf ? `<label style="margin:0"><input type="checkbox" id="bunconf" style="width:auto"${billingFilter.unconfOnly ? ' checked' : ''}> 只看未配置</label>` : ''}
        <button id="brefresh">刷新</button>
      </div>
      <div id="btbl"></div>
      <p class="muted" style="margin:10px 0 0">计费版本 <span class="mono">${esc(d.current_pricing_version || '—')}</span> · 排序：未配置在前、花费降序${d.billing_meta_available ? '' : ' · <b>部分模型缺少计费元数据</b>'}。</p>
    </div>
  </div>`));

  const tbl = document.getElementById('btbl');
  const renderTable = () => {
    const q = billingFilter.q.trim().toLowerCase();
    const shown = models.filter((m) => (!billingFilter.unconfOnly || m.configured === false) && (!q || m.model.toLowerCase().includes(q)));
    tbl.innerHTML = table(['模型', '状态', '输入 $/1M', '缓存读', '缓存写5m/1h', '特殊规则', '7天请求', '7天消费', '来源', '操作'], shown, (m) => `<tr>
      <td class="mono">${esc(m.model)}</td>
      <td>${statusTag(m)}</td>
      <td>${pcell(m.price, 'in')}</td>
      <td>${pcell(m.price, 'cached_in')}</td>
      <td>${pcell(m.price, 'cache_write_5m')} / ${pcell(m.price, 'cache_write_1h')}</td>
      <td class="muted" style="max-width:240px">${m.rules?.length ? esc(m.rules.join('、')) : '—'}</td>
      <td>${fmtNum(m.usage?.requests)}</td>
      <td>${fmtCost(m.usage?.cost_usd)}</td>
      <td class="muted">${(m.sources || []).map((s) => BILLING_SRC[s] || s).join('、') || '—'}</td>
      <td><button data-bd="${esc(m.model)}">详情</button></td></tr>`);
    tbl.querySelectorAll('[data-bd]').forEach((b) => (b.onclick = () => showDetail(models.find((m) => m.model === b.dataset.bd))));
  };

  const qInput = document.getElementById('bq');
  qInput.value = billingFilter.q;
  qInput.oninput = (e) => { billingFilter.q = e.target.value; renderTable(); };
  const unconfBox = document.getElementById('bunconf');
  if (unconfBox) unconfBox.onchange = (e) => { billingFilter.unconfOnly = e.target.checked; renderTable(); };
  document.getElementById('brefresh').onclick = () => loadModelBilling(view);
  renderTable();
}

/*

 *
 * 顶上那块「路由缺口」是这个页面存在的直接理由：请求了但一个渠道都匹配不上的
 * 模型，以前只会变成一次 503 消失在空气里。

const HEALTH_STATE = {
  ok: ['正常', 'ok'],
  degraded: ['降级', 'warn'],
  down: ['故障', 'err'],
  unknown: ['样本不足', ''],
};
const ms = (v) => (v ? (v >= 1000 ? (v / 1000).toFixed(1) + 's' : v + 'ms') : '—');
const pct = (v) => (v === null || v === undefined ? '—' : (v * 100).toFixed(1) + '%');
const stateTag = (s) => `<span class="tag ${HEALTH_STATE[s]?.[1] || ''}">${HEALTH_STATE[s]?.[0] || s}</span>`;

async function pageHealth(view) {
  await loadHealth(view);
  autoRefresh(() => loadHealth(view));
}

async function loadHealth(view) {
  const [ch, md, events, billing] = await Promise.all([
    api('/health/channels?window=60m'),
    api('/health/models?window=24h'),
    api('/health/events?limit=50'),

  ]);
  const bun = billing?.totals?.unconfigured || 0;

  const worst = ['down', 'degraded', 'ok', 'unknown'].find((s) => ch.channels.some((x) => x.state === s)) || 'unknown';
  const gaps = md.missing || [];

  view.replaceChildren($(`<div>
    ${bun > 0 ? `<div class="card" style="border-color:var(--err);margin-bottom:16px;padding:10px 16px"><span style="color:var(--err)">${bun} 个模型未配置价格</span> · <a href="#billing">去处理</a></div>` : ''}
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="k">整体</div><div class="v">${HEALTH_STATE[worst]?.[0] || worst}</div></div>
      <div class="stat"><div class="k">近 1 小时请求</div><div class="v">${ch.channels.reduce((n, x) => n + x.requests, 0)}</div></div>
      <div class="stat"><div class="k">近 1 小时失败</div><div class="v">${ch.channels.reduce((n, x) => n + x.failures, 0)}</div></div>
      <div class="stat"><div class="k">路由缺口</div><div class="v">${gaps.length}</div></div>
    </div>

    ${gaps.length ? `<div class="card" style="border-color:var(--err)">
      <h2 style="color:var(--err)">路由缺口：有请求指向了没有渠道的模型</h2>
      <p class="muted">这些请求直接收到 503。<b>declared=0</b> 表示没有任何渠道声明过该模型（去渠道页把模型加进「模型」列表）；<b>declared&gt;0 而 enabled=0</b> 表示声明它的渠道都被禁用了。</p>
      ${table(['模型', '次数', '最近一次', '声明/启用'], gaps, (g) => `<tr>
        <td class="mono">${esc(g.model_name || '(空)')}</td>
        <td>${g.n}</td><td>${ts(g.last_at)}</td>
        <td>${g.declared} / ${g.enabled}</td></tr>`)}
    </div>` : ''}

    <div class="card"><h2>渠道（近 1 小时）</h2>
      ${table(['ID', '名称', '类型', '状态', '请求', '成功率', 'p50', 'p95', '冷却', '最近错误'], ch.channels, (x) => `<tr>
        <td>${x.id}</td><td>${esc(x.name)}</td><td class="mono">${esc(x.type)}</td>
        <td>${stateTag(x.state)}</td>
        <td>${x.requests}${x.attempts_failed > x.failures ? ` <span class="muted">(+${x.attempts_failed - x.failures} 重试)</span>` : ''}</td>
        <td>${pct(x.success_rate)}</td><td>${ms(x.p50_ms)}</td><td>${ms(x.p95_ms)}</td>
        <td>${x.cooldown.cooling ? `<span class="tag warn">${x.cooldown.secondsLeft}s</span>` : '—'}</td>
        <td class="mono" style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${x.last_error ? esc((x.last_error.status || '') + ' ' + (x.last_error.text || '').slice(0, 120)) : '—'}</td>
        </tr>`)}
      <p class="muted" style="margin:10px 0 0">成功率的分母只算「最终结果」：中途重试掉的那几次单独记在括号里。样本少于 5 时不下结论。</p>
    </div>

    <div class="card"><h2>模型（近 24 小时）</h2>
      ${table(['模型', '状态', '请求', '成功', '失败', '成功率'], md.models, (m) => `<tr>
        <td class="mono">${esc(m.model)}</td><td>${stateTag(m.state)}</td>
        <td>${m.requests}</td><td>${m.successes}</td><td>${m.failures}</td><td>${pct(m.success_rate)}</td></tr>`)}
    </div>

    <div class="card"><h2>最近失败事件</h2>
      ${table(['时间', '阶段', '状态码', '模型', '渠道', '最终', '耗时', '报文'], events, (e) => `<tr>
        <td>${ts(e.created_at)}</td><td class="mono">${esc(e.stage)}</td><td>${e.status || '—'}</td>
        <td class="mono">${esc(e.model_name || '—')}</td><td>${e.channel_id || '—'}</td>
        <td>${e.final ? '是' : ''}</td><td>${ms(e.elapsed_ms)}</td>
        <td class="mono" style="max-width:420px;overflow:hidden;text-overflow:ellipsis">${esc(e.error_text || e.error_code || '')}</td></tr>`)}
    </div>
  </div>`));
}

async function pageTerminal(view) {
  view.replaceChildren($(`<div class="card">
    <h2>终端</h2>
    <p class="muted" style="margin-bottom:6px">终端里的命令与 REST 完全等价（同一套库函数），也可以在真终端里用 curl 调：</p>
    <p class="mono" style="white-space:pre-wrap;word-break:break-all;margin:0 0 12px">curl -X POST ${esc(location.origin)}/api/cli -H "Authorization: Bearer &lt;管理令牌&gt;" -H "Content-Type: application/json" -d '{"command":"status"}'</p>
    <div class="term">
      <div class="term-out" id="termOut"><div class="term-hint">输入 help 查看可用命令。</div></div>
      <div class="term-in"><span class="ps">oneapi&gt;&nbsp;</span><input id="termIn" autocomplete="off" spellcheck="false"></div>
    </div>
  </div>`));

  const out = document.getElementById('termOut');
  const input = document.getElementById('termIn');
  const hist = [];   // 本页输入历史，仅存内存
  let histPos = -1;  // -1 = 不在历史中；↑ 从末尾往前翻，↓ 翻过开头回到空行

  const append = (text, cls = '') => {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = text; // 纯文本追加，不做 HTML 渲染
    out.append(el);
    out.scrollTop = out.scrollHeight;
  };

  const run = async (line) => {
    append(`oneapi> ${line}`);
    if (line === 'clear') { out.replaceChildren(); return; } // 本地清屏，不发给后端
    try {
      const r = await api('/cli', { method: 'POST', body: { command: line } });
      append(r?.output ?? '', r?.ok === false ? 'term-err' : '');
    } catch (e) {
      append(e.message || String(e), 'term-err'); // 网络/401 等异常也进输出区
    }
  };

  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      const line = input.value.trim();
      input.value = '';
      histPos = -1;
      if (!line) return;
      hist.push(line);
      run(line);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!hist.length) return;
      histPos = histPos === -1 ? hist.length - 1 : Math.max(0, histPos - 1);
      input.value = hist[histPos];
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histPos === -1) return;
      histPos += 1;
      if (histPos >= hist.length) { histPos = -1; input.value = ''; }
      else input.value = hist[histPos];
    }
  };

  input.focus();
}

      <div class="grid">
        <div><label>预扣额度下限（quota）</label><input id="PreConsumedQuota" type="number" value="${cur.PreConsumedQuota ?? 0}"><p class="muted" style="margin:4px 0 0">默认 ${esc(defs.PreConsumedQuota ?? '—')}</p></div>
        <div><label>失败重试次数</label><input id="RetryTimes" type="number" min="0" max="10" value="${cur.RetryTimes ?? 0}"><p class="muted" style="margin:4px 0 0">默认 ${esc(defs.RetryTimes ?? '—')}</p></div>
        <div><label>渠道冷却基数（秒）</label><input id="ChannelCooldownBaseSec" type="number" min="0" value="${cur.ChannelCooldownBaseSec ?? 0}"><p class="muted" style="margin:4px 0 0">默认 ${esc(defs.ChannelCooldownBaseSec ?? '—')}</p></div>
        <div><label>渠道冷却上限（秒）</label><input id="ChannelCooldownMaxSec" type="number" min="0" value="${cur.ChannelCooldownMaxSec ?? 0}"><p class="muted" style="margin:4px 0 0">默认 ${esc(defs.ChannelCooldownMaxSec ?? '—')}</p></div>
      </div>
      <label><input type="checkbox" id="HealthEventsEnabled" style="width:auto" ${cur.HealthEventsEnabled ? 'checked' : ''}> 记录健康事件（失败请求写入 relay_events，供健康页统计）</label>
      <label>仅决策接口的模型（JSON 数组，如 ["~typesafe/jev-latest"]）</label>
      <textarea id="DecisionOnlyModels">${esc(JSON.stringify(cur.DecisionOnlyModels ?? [], null, 2))}</textarea>
      <p class="muted" style="margin:4px 0 0">列在这里的模型不会出现在 <code>/v1/models</code>，发去 <code>/v1/chat/completions</code> 会被明确拒绝，只能走 <code>POST /v1/decisions</code>。内置规则已覆盖 Jev，这里<b>只能追加</b>。</p>
      <div style="margin-top:12px"><button class="primary" id="saveOpts">保存系统设置</button></div>
    </div>
    <div class="card"><h2>自检</h2>
      <div class="row"><button id="runWd">运行自检</button><span class="muted">执行一次 watchdog 检查，结果显示在下方（原始 JSON）。</span></div>
      <pre id="wdOut" class="mono" style="white-space:pre-wrap;margin:10px 0 0"></pre>
    </div>
  </div>`));

  document.getElementById('saveOpts').onclick = async () => {
    try {
      const body = {
        SystemName: val(document, 'SystemName'),
        PreConsumedQuota: num(val(document, 'PreConsumedQuota')),
        RetryTimes: num(val(document, 'RetryTimes')),
        ChannelCooldownBaseSec: num(val(document, 'ChannelCooldownBaseSec')),
        ChannelCooldownMaxSec: num(val(document, 'ChannelCooldownMaxSec')),
        HealthEventsEnabled: document.getElementById('HealthEventsEnabled').checked,
        DecisionOnlyModels: JSON.parse(val(document, 'DecisionOnlyModels') || '[]'),
      };
      await api('/options', { method: 'PUT', body });
      state.status = await api('/status');
      toast('已保存', 'ok'); render();
    } catch (e) { toast(e.message, 'err'); }
  };

  document.getElementById('runWd').onclick = async () => {
    const out = document.getElementById('wdOut');
    try {
      out.textContent = '运行中…';
      const r = await api('/watchdog/run', { method: 'POST' });
      out.textContent = JSON.stringify(r, null, 2);
    } catch (e) { out.textContent = ''; toast(e.message, 'err'); }
  };
}

boot();
</script>
</body>
</html>
